name: Tangyixiao Workflow project check
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Full commit SHA of the reviewed toolkit source
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: tangyixiao-workflow-project-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate fixed toolkit revision
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
        run: node -e "if (!/^[a-f0-9]{40}$/.test(process.env.TOOLKIT_REF || '')) process.exit(1)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangyixiao/tangyixiao-workflow
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node toolkit/bin/pwf.mjs check --project project --json
