name: Tangyixiao Workflow project check
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Full commit SHA of the reviewed toolkit source
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: tangyixiao-workflow-project-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the toolkit revision is a full commit SHA
        id: revision
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
        run: node -e "if (!/^[a-f0-9]{40}$/.test(process.env.TOOLKIT_REF || '')) process.exit(1)"
      - name: Check out the project to inspect
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - name: Check out the requested toolkit revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tangyixiao/tangyixiao-workflow
          ref: ${{ inputs.toolkit-ref }}
          path: toolkit
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check project configuration and the managed AGENTS section
        id: project_check
        run: node toolkit/bin/pwf.mjs check --project project --json
      - name: Summarize the project check
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REVISION: ${{ steps.revision.outcome }}
          PROJECT_CHECK: ${{ steps.project_check.outcome }}
        run: |
          if [[ "$REVISION" == failure ]]; then
            echo 'The toolkit revision check failed. Set `toolkit-ref` to the full 40-character lowercase commit SHA.'
          elif [[ "$PROJECT_CHECK" == failure ]]; then
            echo 'The project check failed. Open **Check project configuration and the managed AGENTS section** and inspect the reported error or failing check.'
          elif [[ "$PROJECT_CHECK" == success ]]; then
            echo 'The project configuration and managed AGENTS section match the adoption receipt.'
          else
            echo 'Setup stopped before the project check. Open the failed checkout or Node.js step.'
          fi >> "$GITHUB_STEP_SUMMARY"
