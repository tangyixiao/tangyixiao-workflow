name: Validate the bilingual project website
on:
  pull_request:
    paths:
      - 'project-website/**'
      - '.github/workflows/check-project-website.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: project-website
      - name: Check rendered pages, local links and translations
        run: python3 project-website/scripts/check.py
      - name: Check keyboard, language and theme controls at responsive widths
        run: python3 project-website/scripts/smoke_browser.py project-website --screenshots "${RUNNER_TEMP}/website-review" --round after
      - name: Save browser screenshots for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-screenshots
          path: ${{ runner.temp }}/website-review
          if-no-files-found: error
          retention-days: 3
          overwrite: true
